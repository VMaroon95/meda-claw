name: MedaClaw Governance Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install meda-claw
        run: pip install .

      - name: Run Governance Audit
        run: |
          medaclaw report --json . > audit_report.json || true
          cat audit_report.json

      - name: Display Score
        run: |
          if [ -f audit_report.json ]; then
            SCORE=$(python3 -c "import json; print(json.load(open('audit_report.json'))['governance_score'])")
            echo "🦞 Governance Score: $SCORE/100"
          else
            echo "⚠️ No audit report generated"
          fi

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-report
          path: audit_report.json
          if-no-files-found: warn
